{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h2>Log in</h2>
<form method="post">
  <label for="user_id">Choose a demo account:</label>
  <select name="user_id" id="user_id">
  {% for uid, u in users.items() %}
    <option value="{{ uid }}">{{ u.name }}</option>
  {% endfor %}
  </select>
  <button type="submit">Log in</button>
</form>
{% endblock %}
